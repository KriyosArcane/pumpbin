# cargo-deny configuration for PumpBin.
#
# Gates the CI build on:
# No known security advisories in any transitive dep.
# No banned licenses (e.g. AGPL surprises).
# No duplicate crate versions (besides documented exceptions).
#
# Run locally with:  cargo deny check

[graph]
all-features = false

[advisories]
version = 2
yanked = "warn"
# v2.0.0: empty. Extism removal pulled `instant` / `paste` /
# `wasmtime` / `bincode 1.x` out of the dep cone along with their
# associated RUSTSEC ignores. Reintroduce any ignore here only with a
# dated, named justification and a re-check window.
ignore = [
    # 2026-05-28: bincode 2.x unmaintained (team disbanded post-doxxing).
    # No safe upgrade exists; bincode 2.0.1 is functionally correct and
    # is our .b1n config format. Migration to postcard tracked as a
    # follow-up. Re-check when an actively-maintained drop-in appears
    # or by 2026-12-31.
    { id = "RUSTSEC-2025-0141", reason = "bincode 2.x unmaintained; no safe alternative; migration deferred (re-check 2026-12-31)" },
    # 2026-05-28: paste is unmaintained (dtolnay archived the repo).
    # Reaches us only via iced -> wgpu -> metal (GUI-only feature). The
    # CLI binary doesn't pull it in. Wgpu pins it transitively; upgrading
    # would mean waiting for wgpu/metal to switch to `pastey` or
    # `with_builtin_macros`. Re-check when wgpu 0.20+ propagates through
    # iced or by 2026-12-31.
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; GUI-only via iced/wgpu/metal; upstream pinned (re-check 2026-12-31)" },
    # 2026-05-28: instant is unmaintained, replaced by web-time. Reaches
    # us only via iced -> parking_lot 0.11 (GUI-only). Cannot upgrade
    # without an iced patch. Same re-check window as paste.
    { id = "RUSTSEC-2024-0384", reason = "instant unmaintained; GUI-only via iced/parking_lot 0.11; upstream pinned (re-check 2026-12-31)" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "OpenSSL",
]
confidence-threshold = 0.8

[[licenses.exceptions]]
allow = ["OpenSSL"]
name = "ring"

# webpki-roots ships a snapshot of the Mozilla root certificate store under
# CDLA-Permissive-2.0 (data-only license). Permissive, no source-disclosure
# obligations, no patent traps. Scoped to this single crate.
[[licenses.exceptions]]
allow = ["CDLA-Permissive-2.0"]
name = "webpki-roots"

[bans]
multiple-versions = "warn"
wildcards = "warn"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
