# cargo-deny configuration for PumpBin.
#
# Gates the CI build on:
# - No known security advisories in any transitive dep.
# - No banned licenses (e.g. AGPL surprises).
# - No duplicate crate versions (besides documented exceptions).
#
# Run locally with:  cargo deny check

[graph]
all-features = false

[advisories]
version = 2
yanked = "warn"
ignore = [
    # rustls-pemfile unmaintained — pulled in transitively via reqwest /
    # ureq stack used by extism. No CVE, no security impact, no
    # drop-in replacement yet. Re-check when the rustls ecosystem
    # migrates to rustls-pki-types-only loading.
    { id = "RUSTSEC-2025-0134", reason = "unmaintained, no replacement upstream yet" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "OpenSSL",
]
confidence-threshold = 0.8

[[licenses.exceptions]]
allow = ["OpenSSL"]
name = "ring"

# webpki-roots ships a snapshot of the Mozilla root certificate store under
# CDLA-Permissive-2.0 (data-only license). Permissive, no source-disclosure
# obligations, no patent traps. Scoped to this single crate.
[[licenses.exceptions]]
allow = ["CDLA-Permissive-2.0"]
name = "webpki-roots"

[bans]
multiple-versions = "warn"
wildcards = "warn"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Temporary git pin for extism (see [patch.crates-io] in Cargo.toml).
# Drop the moment extism cuts a release > 1.21.0 that ships
# wasmtime >= 43.
allow-git = ["https://github.com/extism/extism"]
