[package]
name = "pumpbin"
version = "2.1.0"
authors = ["KriyosArcane"]
edition = "2021"
description = "Implant build pipeline — stamp shellcode into a loader, apply post-build transforms, get an implant."
readme = "README.md"
repository = "https://github.com/KriyosArcane/pumpbin"
license = "MIT"
build = "build.rs"
keywords = ["implant", "shellcode", "loader", "red-team", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
dirs = "5.0.1"
anyhow = "1.0"
thiserror = "2.0"
chrono = "0.4"
rand = "0.9"
memchr = "2.7"
capnp = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
flate2 = "1.0"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
tempfile = "3.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "json", "ansi", "std"] }
libc = "0.2"
owo-colors = "4"
zeroize = { version = "1.8.2", features = ["derive"] }
toml = { version = "1.1.2", features = ["parse"] }
sha2 = "0.10"
aes-gcm = "0.10"

[features]
default = []

[[bin]]
name = "pumpbin-cli"
path = "src/bin/pumpbin-cli.rs"

[package.metadata.winresource]
LegalCopyright = "Copyright (c) 2024 b1n <b1n@b1n.io>"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.17"

[dev-dependencies]
rand_chacha = "0.9"
sha2 = "0.10"
tempfile = "3.10"

[build-dependencies]
capnpc = "0.24"

[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.test]
debug = "line-tables-only"
split-debuginfo = "unpacked"
