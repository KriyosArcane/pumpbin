[package]
name = "pumpbin"
version = "1.5.0"
authors = ["b1n <b1n@b1n.io>"]
edition = "2021"
description = "PumpBin is an Implant Generation Platform."
documentation = "https://pumpbin.b1n.io"
readme = "README.md"
homepage = "https://b1n.io"
repository = "https://github.com/pumpbin/pumpbin"
license = "MIT"
build = "build.rs"

[dependencies]
rfd = "0.14"
dirs = "5.0.1"
open = "5.3"
bincode = { version = "2.0.0-rc.3", default-features = false , features = ["alloc", "derive", "std"]}
anyhow = "1.0"
thiserror = "1.0"
chrono = "0.4"
rand = "0.8"
memchr = "2.7"
capnp = "0.19"
extism = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
flate2 = "1.0"
iced_aw = { version = "0.11", default-features = false, features = ["menu"] }

iced = { version = "0.13", default-features = false, features = ["wgpu", "tiny-skia", "advanced", "svg", "tokio", "image"] }
regex = "1.10"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
tempfile = "3.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "json", "ansi", "std"] }
zeroize = { version = "1.8.2", features = ["derive"] }
toml = { version = "1.1.2", features = ["parse"] }
sha2 = "0.10"
# Host helper ABI (v1.5.0, Phase A). The SDK declares extern "ExtismHost"
# imports against the `pumpbin:host/v1` namespace; the host registers
# matching closures via Extism `with_function` in
# `src/host_helpers/`. Plugins call into the host for PE patching and
# structured logging instead of bundling these libs in every `.wasm`.
pumpbin-plugin-sdk = { path = "plugin-sdk" }
goblin = { version = "0.10", default-features = false, features = ["std", "pe32", "pe64", "endian_fd"] }

[[bin]]
name = "pumpbin-cli"
path = "src/bin/pumpbin-cli.rs"

[package.metadata.winresource]
LegalCopyright = "Copyright (c) 2024 b1n <b1n@b1n.io>"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.17"

[dev-dependencies]
rand_chacha = "0.3"
sha2 = "0.10"
tempfile = "3.10"

[build-dependencies]
capnpc = "0.19"

[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1

# Slim the dev / test target tree. Each test binary was statically
# linking the full DWARF for wasmtime + cranelift, ballooning
# target/debug to ~16 GB on a fresh build (~500 MB per test binary,
# 17 test binaries). `line-tables-only` keeps panic/backtrace info
# while dropping per-type debug info; `unpacked` split-debuginfo
# moves the remaining DWARF into sibling .dwo/.dwp files instead of
# embedding in the binary. Together they shrink target/debug ~5x
# with no source change and no measurable behavior change for tests.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.test]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# NOTE: v1.4.6 attempted to pin extism to git HEAD to pull wasmtime
# 43 here, but the patch silently no-op'd — upstream extism's HEAD
# Cargo.toml declares `version = "0.0.0+replaced-by-ci"` (a CI
# placeholder), which the resolver cannot match against pumpbin's
# `^1.4` requirement. The graph kept resolving to the registry
# `extism 1.21.0` -> `wasmtime 41.0.4`, leaving the advisory chain
# unaddressed. See deny.toml's RUSTSEC-2026-0114 ignore for the
# real status.
