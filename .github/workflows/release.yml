name: build-release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

# v1.1.x integrated the Maker into the main pumpbin binary as a
# workspace toggle, so there is no separate maker binary anymore.
# We ship two binaries per platform: pumpbin (GUI) and pumpbin-cli.
# aarch64 cross-compiles were removed because the previous workflow
# pointed at a third-party gist for an apt sources.list -- thats a
# supply-chain surface PumpBin should not accept. aarch64 is on the
# v2.x roadmap with a clean cross-compile setup.

jobs:
  build-windows:
    name: build-windows-x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bin pumpbin --target=x86_64-pc-windows-msvc
      - run: cargo build --release --bin pumpbin-cli --target=x86_64-pc-windows-msvc
      - shell: bash
        run: |
          mv target/x86_64-pc-windows-msvc/release/pumpbin.exe PumpBin-x86_64-pc-windows-msvc.exe
          mv target/x86_64-pc-windows-msvc/release/pumpbin-cli.exe PumpBin-cli-x86_64-pc-windows-msvc.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            PumpBin-x86_64-pc-windows-msvc.exe
            PumpBin-cli-x86_64-pc-windows-msvc.exe

  build-macos:
    name: build-macos-x64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bin pumpbin --target=x86_64-apple-darwin
      - run: cargo build --release --bin pumpbin-cli --target=x86_64-apple-darwin
      - run: |
          mv target/x86_64-apple-darwin/release/pumpbin PumpBin-x86_64-apple-darwin
          mv target/x86_64-apple-darwin/release/pumpbin-cli PumpBin-cli-x86_64-apple-darwin
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            PumpBin-x86_64-apple-darwin
            PumpBin-cli-x86_64-apple-darwin

  build-linux:
    name: build-linux-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libgtk-3-dev libssl-dev libudev-dev
      - run: cargo build --release --bin pumpbin --target=x86_64-unknown-linux-gnu
      - run: cargo build --release --bin pumpbin-cli --target=x86_64-unknown-linux-gnu
      - run: |
          mv target/x86_64-unknown-linux-gnu/release/pumpbin PumpBin-x86_64-unknown-linux-gnu
          mv target/x86_64-unknown-linux-gnu/release/pumpbin-cli PumpBin-cli-x86_64-unknown-linux-gnu
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            PumpBin-x86_64-unknown-linux-gnu
            PumpBin-cli-x86_64-unknown-linux-gnu
