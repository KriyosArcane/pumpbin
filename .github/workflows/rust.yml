name: CI

on:
  push:
    branches: ["main", "hotfix/**", "release/**"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libgtk-3-dev libssl-dev libudev-dev capnproto
      - run: cargo clippy --all-targets -- -D warnings

  test-linux:
    name: test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libgtk-3-dev libssl-dev libudev-dev capnproto
      - run: cargo test --lib --tests --no-fail-fast

  test-macos:
    name: test (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: brew install capnp
      - run: cargo test --lib --tests --no-fail-fast

  test-windows:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: choco install capnproto -y --no-progress
      - run: cargo test --lib --tests --no-fail-fast

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  gui-build:
    name: GUI binary build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libgtk-3-dev libssl-dev libudev-dev capnproto
      - run: cargo build --release --bin pumpbin --features gui

  cli-smoke-linux:
    name: CLI smoke (linux)
    needs: test-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y capnproto
      - run: cargo build --release --bin pumpbin-cli
      - run: |
          ./target/release/pumpbin-cli --version
          ./target/release/pumpbin-cli --help
          ./target/release/pumpbin-cli generate --help
          ./target/release/pumpbin-cli batch --help
          ./target/release/pumpbin-cli create-b1n --help
          ./target/release/pumpbin-cli verify --help
          ./target/release/pumpbin-cli build --help
          ./target/release/pumpbin-cli inspect --help
          ./target/release/pumpbin-cli convert --help

  cli-smoke-macos:
    name: CLI smoke (macos)
    needs: test-macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: brew install capnp
      - run: cargo build --release --bin pumpbin-cli
      - run: |
          ./target/release/pumpbin-cli --version
          ./target/release/pumpbin-cli --help

  cli-smoke-windows:
    name: CLI smoke (windows)
    needs: test-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: choco install capnproto -y --no-progress
      - run: cargo build --release --bin pumpbin-cli
      - shell: pwsh
        run: |
          .\target\release\pumpbin-cli.exe --version
          .\target\release\pumpbin-cli.exe --help
