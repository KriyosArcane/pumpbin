[package]
name = "pumpbin-plugin-sdk"
version = "0.1.0"
edition = "2021"
description = "Shared types and helpers for writing PumpBin WASM plugins"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
extism-pdk = "1.4.1"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
